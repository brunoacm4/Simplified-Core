# UE simulado (UERANSIM).
# Credenciais tem de coincidir com o subscritor provisionado no MongoDB
# (lab/scripts/provision-subscribers.js) e o slice com amf.yaml.

supi: 'imsi-999700000000001'
mcc: '999'
mnc: '70'

# Esquema de protecao do SUPI. 0 = null scheme: o SUCI vai em claro, o que
# mantem o registo legivel na captura. Os esquemas 1/2 (ECIES) sao um custo
# adicional que podemos medir depois, isoladamente.
protectionScheme: 0
# A chave tem de estar preenchida mesmo com esquema nulo: o UERANSIM v3.3.0
# valida o comprimento do campo no arranque, antes de olhar para o esquema
# ("Field 'homeNetworkPublicKey' is too small"). Esta e a chave publica
# curve25519 de teste, correspondente a hnet id 1 do Open5GS. Com
# protectionScheme 0 nao chega a ser usada.
homeNetworkPublicKey: '5a8d38864820197c3394b92613b20b91633cbd897119273bf8e4a6f4eec0a650'
homeNetworkPublicKeyId: 1
routingIndicator: '0000'

key: '465B5CE8B199B49FAA5F0A2EE238A6BC'
op: 'E8ED289DEBA952E4283B54E88E6183CA'
opType: 'OPC'
amf: '8000'
imei: '356938035643803'
imeiSv: '4370816125816151'

gnbSearchList:
  - 10.55.3.50

uacAic:
  mps: false
  mcs: false

uacAcc:
  normalClass: 0
  class11: false
  class12: false
  class13: false
  class14: false
  class15: false

sessions:
