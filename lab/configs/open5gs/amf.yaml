# AMF -- Access and Mobility Management Function.
#
# E A PECA CENTRAL DESTA TESE. O objetivo final e um AMF modular em que o
# suporte de mobilidade seja instalavel como plugin. Esta configuracao e a
# BASELINE nao modificada: e contra ela que qualquer reducao futura sera medida.
#
# Notar o que aqui esta e so faz sentido para UEs moveis -- tai (tracking area),
# t3512 (timer de registo periodico), e toda a maquinaria de paging que este
# ficheiro implicitamente ativa. E este o material da auditoria de procedimentos.

logger:
  level: info

global:

amf:
  sbi:
    server:
      - address: 10.55.0.30
        port: 7777
    client:
      scp:
        - uri: http://10.55.0.11:7777
  ngap:
    server:
      - address: 10.55.1.30
  metrics:
    server:
      - address: 10.55.0.30
        port: 9090

  guami:
    - plmn_id:
        mcc: 999
        mnc: 70
      amf_id:
        region: 2
        set: 1

  # Tracking Area: o conceito existe para suportar mobilidade e paging. Num
  # cenario de UEs estaticos e um dos primeiros candidatos a analise.
  tai:
    - plmn_id:
        mcc: 999
        mnc: 70
      tac: 1

  plmn_support:
    - plmn_id:
        mcc: 999
        mnc: 70
      s_nssai:
        - sst: 1

  security:
    integrity_order: [ NIA2, NIA1, NIA0 ]
    # DESVIO DELIBERADO: NEA0 (nulo) em primeiro lugar mantem as mensagens NAS em
    # claro nas capturas, o que e indispensavel para auditar procedimentos. A
    # INTEGRIDADE mantem-se ativa (NIA2). Nao altera a CONTAGEM de sinalizacao;
    # altera o custo criptografico, e por isso fica registado em topologia.md.
    # Para medir o custo da cifra, trocar para [ NEA2, NEA1, NEA0 ].
    ciphering_order: [ NEA0, NEA1, NEA2 ]

  network_name:
    full: PANIC
    short: PANIC

  amf_name: panic-amf0

  time:
    # T3512: periodicidade com que o UE se volta a registar so para dizer que
    # ainda existe. Para um sensor aparafusado a uma maquina, isto e sinalizacao
    # pura sem informacao. Fica no valor por omissao do Open5GS: 540 s = 9 minutos.
    # Confirmado na captura: GPRS Timer 3, unidade 30 s x 18 = 540 s.
    t3512:
      value: 60
