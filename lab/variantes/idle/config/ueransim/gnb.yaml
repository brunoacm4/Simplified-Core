# Baseado em UERANSIM/config/open5gs-gnb.yaml (v3.3.0). Alterações: endereços das redes do lab.
mcc: '999'          # Mobile Country Code value
mnc: '70'           # Mobile Network Code value (2 or 3 digits)

nci: '0x000000010'  # NR Cell Identity (36-bit)
idLength: 32        # NR gNB ID length in bits [22...32]
tac: 1              # Tracking Area Code

linkIp: 10.100.5.50   # gNB's local IP address for Radio Link Simulation (Usually same with local IP)
ngapIp: 10.100.2.50   # gNB's local IP address for N2 Interface (Usually same with local IP)
gtpIp: 10.100.3.50    # gNB's local IP address for N3 Interface (Usually same with local IP)

# List of AMF address information
amfConfigs:
  - address: 10.100.2.5
    port: 38412

# List of supported S-NSSAIs by this gNB
slices:
  - sst: 1

# Indicates whether or not SCTP stream number errors should be ignored.
ignoreStreamIds: true

# Cell access type. When set to one of the satellite types (nr-leo, nr-meo,
# nr-geo, nr-othersat), the gNB attaches the NR-NTN TAI Information extension
# to every UserLocationInformationNR it sends to the AMF. Defaults to "nr".
cellAccessType: nr

# Temporizador de inatividade (extensão nossa, patch 0003). A 3GPP não define este temporizador:
# define só a causa NGAP "user inactivity" que o gNB usa ao libertar. Aqui só conta tráfego do
# utilizador, em qualquer direção; a sinalização não conta.
# 0 = desligado, que é o comportamento do UERANSIM original — os UEs ficam ligados para sempre.
# Para exercitar o ciclo de inatividade, usar a variante 'idle' (variantes/idle/).
inactivityTimer: 10    # segundos sem dados até o gNB pedir a libertação do contexto
minConnectionTime: 5   # segundos após a criação do contexto antes de a libertação ser possível
