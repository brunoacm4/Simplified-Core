# Variante fase 1 ("o core não esquecer os dispositivos conhecidos"): T3512 = 60 s, como a t3512-60s,
# mais as opções dos patches 0007–0009 em braços cumulativos, escolhidos com BRACO:
#   ref   nenhuma opção nova: tem de dar o mesmo que a t3512-60s (regressão da imagem nova)
#   0007  desregisto implícito só 24 h depois de inalcançável (amf.time.implicit_deregistration)
#   0008  0007 + o AMF responde "UE not reachable" em vez de fazer paging (amf.reachability)
#   0009  0008 + o SMF manda o UPF deitar fora os pacotes guardados (smf.dl_buffering, DROBU)
# Os yaml de cada braço são cópias do amf.yaml da t3512-60s e do smf.yaml da baseline com as chaves
# novas. Exige a imagem com os patches 0007–0009 (lab/patches/open5gs/).
#
# Uso: AMF_VARIANTE=fase1 BRACO=0009 ./scripts/medir-fase1.sh <pasta> <sufixo>

services:
  amf:
    volumes: [ "./variantes/fase1/config/open5gs/amf-${BRACO:-ref}.yaml:/etc/open5gs/amf.yaml:ro" ]
  smf:
    volumes: [ "./variantes/fase1/config/open5gs/smf-${BRACO:-ref}.yaml:/etc/open5gs/smf.yaml:ro" ]
