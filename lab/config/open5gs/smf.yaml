# Baseado em open5gs/configs/open5gs/smf.yaml.in (v2.8.0).
# Alterações face ao upstream: endereços (redes do lab) e logging só para stdout.
global:
  max:
    ue: 1024
smf:
  sbi:
    server:
      - address: 10.100.1.4
        port: 7777
    client:
      scp:
        - uri: http://10.100.1.200:7777
  pfcp:
    server:
      - address: 10.100.4.4
    client:
      upf:
        - address: 10.100.4.7
  gtpc:
    server:
      - address: 10.100.4.4
  gtpu:
    server:
      - address: 10.100.4.4
  metrics:
    server:
      - address: 10.100.1.4
        port: 9090
  session:
    - subnet: 10.45.0.0/16
      gateway: 10.45.0.1
    - subnet: 2001:db8:cafe::/48
      gateway: 2001:db8:cafe::1
  dns:
    - 8.8.8.8
    - 8.8.4.4
    - 2001:4860:4860::8888
    - 2001:4860:4860::8844
  mtu: 1400
  freeDiameter: /opt/open5gs/etc/freeDiameter/smf.conf
